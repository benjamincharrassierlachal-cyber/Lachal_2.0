<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lachal 2.0</title>
  <meta name="description" content="Suivi des objectifs du magasin et statistiques de vente." />
  <meta name="theme-color" content="#0a0c11" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lachal" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { min-height: 100vh; }
    .hub {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 22px calc(40px + env(safe-area-inset-bottom)); max-width: 880px; margin: 0 auto;
      background:
        radial-gradient(ellipse 60% 40% at 15% 10%, color-mix(in srgb, var(--c-avis) 16%, transparent), transparent 70%),
        radial-gradient(ellipse 60% 40% at 85% 90%, color-mix(in srgb, var(--c-examens) 18%, transparent), transparent 70%);
    }
    .hub-brand {
      font-size: 38px; font-weight: 800; letter-spacing: -0.01em; text-align: center;
      background: linear-gradient(135deg, var(--c-avis), var(--c-examens));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hub-sub { color: var(--text-dim); font-size: 14px; margin: 6px 0 34px; text-align: center; }
    .hub-grid { display: grid; grid-template-columns: 1fr; gap: 18px; width: 100%; max-width: 420px; }
    @media (min-width: 720px) { .hub-grid { grid-template-columns: 1fr 1fr; max-width: 760px; } }
    .hub-card {
      --hc: var(--c-avis);
      position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
      padding: 30px 22px 26px; border-radius: 26px; text-decoration: none; color: var(--text);
      background: linear-gradient(165deg, color-mix(in srgb, var(--hc) 22%, var(--surface)) 0%, var(--surface) 70%);
      border: 1px solid color-mix(in srgb, var(--hc) 50%, var(--surface-3));
      box-shadow: 0 18px 44px -22px var(--hc);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .hub-card:hover { transform: translateY(-3px); box-shadow: 0 24px 54px -20px var(--hc); }
    .hub-card:active { transform: scale(0.97); }
    .hub-card--stats { --hc: var(--c-examens); }
    .hub-logo { width: 118px; height: 118px; filter: drop-shadow(0 8px 22px color-mix(in srgb, var(--hc) 55%, transparent)); }
    .hub-logo svg { width: 100%; height: 100%; display: block; }
    .hub-name { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
    .hub-desc { font-size: 13px; line-height: 1.5; color: var(--text-dim); max-width: 280px; }
    .hub-go {
      margin-top: 6px; padding: 9px 22px; border-radius: 999px; font-size: 13px; font-weight: 700;
      background: var(--hc); color: #0a0c11;
    }
    .hub-lock { font-size: 11px; color: var(--text-dim); }
  </style>
</head>
<body>
  <main class="hub">
    <div class="hub-brand">Lachal 2.0</div>
    <p class="hub-sub">Choisissez une application</p>
    <div class="hub-grid">
      <a class="hub-card" href="sante.html">
        <div class="hub-logo">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <polygon points="100,22 167.5,61 167.5,139 100,178 32.5,139 32.5,61" fill="#ff9f1c" stroke="#ff9f1c" stroke-width="6" stroke-linejoin="round"/>
            <polygon points="100,44 148.5,72 148.5,128 100,156 51.5,128 51.5,72" fill="#a78bfa" stroke="#a78bfa" stroke-width="6" stroke-linejoin="round"/>
            <polygon points="100,66 129.4,83 129.4,117 100,134 70.6,117 70.6,83" fill="#2dd4bf" stroke="#2dd4bf" stroke-width="6" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="hub-name">Suivi &amp; Trophées</div>
        <div class="hub-desc">Les objectifs de la semaine : avis Google, examens de vue, impressions 3D, et vos trophées.</div>
        <span class="hub-go">Entrer</span>
      </a>
      <a class="hub-card hub-card--stats" href="stats/">
        <div class="hub-logo">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff9f1c"/><stop offset="0.55" stop-color="#fb5eae"/><stop offset="1" stop-color="#a78bfa"/>
              </linearGradient>
            </defs>
            <polygon points="100,24 166,62 166,138 100,176 34,138 34,62" fill="none" stroke="url(#hg)" stroke-width="15" stroke-linejoin="round"/>
            <polygon points="100,52 142,76 142,124 100,148 58,124 58,76" fill="#12151d" stroke="#262b38" stroke-width="3" stroke-linejoin="round"/>
            <polyline points="62,102 82,102 92,80 108,128 119,96 126,102 140,102" fill="none" stroke="#2dd4bf" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="hub-name">Stats</div>
        <div class="hub-desc">Les ventes par magasin et par collaborateur, avec le curseur de santé.</div>
        <span class="hub-go">Entrer</span>
        <span class="hub-lock">🔒 Accès protégé par code</span>
      </a>
    </div>
  </main>
</body>
</html>
